<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="site-title">Cargando...</title>

  <script src="../../../js/config/config.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="../../../css/style.css">
</head>
<body class="bg-slate-950 text-slate-100 flex h-screen transition-colors">
  
  <div id="app-aside"></div>

  <div class="flex-1 flex flex-col min-w-0 overflow-hidden">

    <main class="flex-1 overflow-y-auto p-4 md:p-6 flex flex-col gap-4 bg-slate-950/40">
      
      <!-- Filtros -->
      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-lg flex flex-col gap-4">
        <div class="flex items-center justify-between border-b border-slate-800 pb-3">
          <h2 class="text-xs font-bold uppercase tracking-wider text-slate-400 flex items-center gap-2">
            <i class="fa-solid fa-sitemap text-blue-400"></i> Plan de Cuentas Contables
          </h2>
          <span id="contadorRegistros" class="text-xs font-mono bg-blue-500/10 text-blue-400 px-2.5 py-1 rounded-lg border border-blue-500/20">Cant : 0</span>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 text-xs">
          <div>
            <label class="block text-slate-400 mb-1 font-semibold">Buscador :</label>
            <input type="text" id="inputBuscador" placeholder="Escriba para filtrar cuenta..." class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-slate-200">
          </div>
          <div>
            <label class="block text-slate-400 mb-1 font-semibold">Buscar en :</label>
            <select id="filtroCampo" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-slate-200">
              <option value="codigo">CODIGO</option>
              <option value="cuenta">CUENTA</option>
              <option value="tipo_cuenta">TIPO CUENTA</option>
            </select>
          </div>
        </div>
      </div>

      <!-- Tabla -->
      <div class="flex-1 bg-slate-900 border border-slate-800 rounded-2xl shadow-xl overflow-hidden flex flex-col min-h-[320px]">
        <div class="flex-1 overflow-auto">
          <table class="w-full text-left text-xs whitespace-nowrap">
            <thead class="bg-slate-950 text-slate-400 uppercase font-semibold sticky top-0 border-b border-slate-800 z-10">
              <tr>
                <th class="p-3.5 border-r border-slate-800/50">SECUENCIA</th>
                <th class="p-3.5 border-r border-slate-800/50">CODIGO</th>
                <th class="p-3.5 border-r border-slate-800/50">CUENTA</th>
                <th class="p-3.5 border-r border-slate-800/50">TIPO CUENTA</th>
                <th class="p-3.5 border-r border-slate-800/50">NIVEL</th>
                <th class="p-3.5">ACEPTA MOV</th>
              </tr>
            </thead>
            <tbody id="tablaPlanCuentasBody" class="divide-y divide-slate-800/60"></tbody>
          </table>
        </div>

        <div class="p-3 bg-slate-900 border-t border-slate-800 flex flex-wrap items-center justify-between gap-2">
          <div class="flex items-center gap-2">
            <button id="btnAbrirAgregar" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-xl font-semibold text-xs transition-all flex items-center gap-2 shadow-lg shadow-blue-600/20"><i class="fa-solid fa-plus"></i> Agregar</button>
            <button id="btnAbrirEditar" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-xl font-semibold text-xs transition-all flex items-center gap-2 border border-slate-700"><i class="fa-solid fa-pen-to-square"></i> Editar</button>
            <button id="btnEliminarCuenta" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-rose-400 rounded-xl font-semibold text-xs transition-all flex items-center gap-2 border border-slate-700"><i class="fa-solid fa-trash"></i> Eliminar</button>
          </div>
          <button id="btnExportarCsv" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-emerald-400 rounded-xl font-semibold text-xs transition-all flex items-center gap-2 border border-slate-700">
            <i class="fa-solid fa-file-excel"></i> Exportar a Excel
          </button>
        </div>
      </div>
    </main>
  </div>

  <!-- Modal Registrar / Editar Cuenta -->
  <div id="modalCuenta" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-lg w-full p-6 shadow-2xl flex flex-col text-xs space-y-4">
      <div class="flex items-center justify-between border-b border-slate-800 pb-3">
        <h3 id="modalTitulo" class="font-bold text-white text-sm flex items-center gap-2">
          <i class="fa-solid fa-plus-circle text-blue-500"></i> Registrar Cuenta Contable
        </h3>
        <button id="btnCerrarModal" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
      </div>

      <form id="formCuenta" class="space-y-3">
        <div>
          <label class="block text-slate-400 mb-1 font-semibold">Código Contable :</label>
          <input type="text" id="cuentaCodigo" required placeholder="Ej: 1.1.01.006" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-slate-200 font-mono font-bold">
        </div>
        <div>
          <label class="block text-slate-400 mb-1 font-semibold">Nombre de la Cuenta :</label>
          <input type="text" id="cuentaNombre" required placeholder="Ej: BANCO MERCANTIL" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-slate-200 uppercase font-bold">
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-slate-400 mb-1 font-semibold">Tipo de Cuenta :</label>
            <select id="cuentaTipo" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-slate-200">
              <option value="ACTIVO">ACTIVO</option>
              <option value="PASIVO">PASIVO</option>
              <option value="PATRIMONIO">PATRIMONIO</option>
              <option value="INGRESO">INGRESO</option>
              <option value="GASTO">GASTO</option>
            </select>
          </div>
          <div>
            <label class="block text-slate-400 mb-1 font-semibold">Nivel Jerárquico :</label>
            <input type="number" id="cuentaNivel" value="4" min="1" max="5" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-slate-200 font-mono">
          </div>
        </div>
        <div>
          <label class="block text-slate-400 mb-1 font-semibold">Acepta Movimientos :</label>
          <select id="cuentaAceptaMov" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-slate-200 font-bold">
            <option value="NO">NO (Cuenta de Resumen)</option>
            <option value="SI">SI (Cuenta de Detalle)</option>
          </select>
        </div>

        <div class="flex justify-end gap-2 pt-3 border-t border-slate-800">
          <button type="button" id="btnCancelarModal" class="px-4 py-2 bg-slate-800 text-slate-300 rounded-xl">Cancelar</button>
          <button type="submit" class="px-5 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-xl font-bold shadow-lg shadow-blue-600/20">Guardar Cuenta</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module">
    import { renderAside } from '../../../js/components/aside.js';
    renderAside('contabilidad');

    import CONFIG from '../../../js/config/config.js';
    // Cambia el título de la pestaña usando los datos de config.js
    document.getElementById('site-title').innerText = `${CONFIG.SYSTEM_NAME.split(' ')[0]} - Plan de Cuentas `;

  </script>
  <script type="module" src="../../../js/contabilidad/plan_cuentas.js"></script>
</body>
</html>
