<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="site-title">Cargando...</title>

  <script src="../../../js/config/config.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="../../../css/style.css">
</head>
<body class="bg-slate-950 text-slate-100 flex h-screen transition-colors">
  
  <div id="app-aside"></div>

  <div class="flex-1 flex flex-col min-w-0 overflow-hidden">

    <main class="flex-1 overflow-y-auto p-4 md:p-6 flex flex-col gap-4 bg-slate-950/40">
      
      <!-- Filtros -->
      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-lg flex flex-col gap-4">
        <div class="flex items-center justify-between border-b border-slate-800 pb-3">
          <h2 class="text-xs font-bold uppercase tracking-wider text-slate-400 flex items-center gap-2">
            <i class="fa-solid fa-list-check text-blue-400"></i> Detalle de Asientos Contables
          </h2>
          <span id="contadorRegistros" class="text-xs font-mono bg-blue-500/10 text-blue-400 px-2.5 py-1 rounded-lg border border-blue-500/20">Detalles : 0</span>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 text-xs">
          <div>
            <label class="block text-slate-400 mb-1 font-semibold">Buscador :</label>
            <input type="text" id="inputBuscador" placeholder="Escriba para filtrar..." class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-slate-200">
          </div>
          <div>
            <label class="block text-slate-400 mb-1 font-semibold">Buscar en :</label>
            <select id="filtroCampo" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-slate-200">
              <option value="asiento">ASIENTO</option>
              <option value="cuenta">CUENTA</option>
              <option value="observacion">OBSERVACION</option>
            </select>
          </div>
        </div>
      </div>

      <!-- Tabla -->
      <div class="flex-1 bg-slate-900 border border-slate-800 rounded-2xl shadow-xl overflow-hidden flex flex-col min-h-[320px]">
        <div class="flex-1 overflow-auto">
          <table class="w-full text-left text-xs whitespace-nowrap">
            <thead class="bg-slate-950 text-slate-400 uppercase font-semibold sticky top-0 border-b border-slate-800 z-10">
              <tr>
                <th class="p-3.5 border-r border-slate-800/50">ID</th>
                <th class="p-3.5 border-r border-slate-800/50">ASIENTO</th>
                <th class="p-3.5 border-r border-slate-800/50">CUENTA</th>
                <th class="p-3.5 border-r border-slate-800/50">TIPO</th>
                <th class="p-3.5 border-r border-slate-800/50">MONTO USD</th>
                <th class="p-3.5 border-r border-slate-800/50">MONTO BS</th>
                <th class="p-3.5 border-r border-slate-800/50">OBSERVACION</th>
                <th class="p-3.5">ESTATUS</th>
              </tr>
            </thead>
            <tbody id="tablaDetalleBody" class="divide-y divide-slate-800/60"></tbody>
          </table>
        </div>

        <div class="p-3 bg-slate-900 border-t border-slate-800 flex flex-wrap items-center justify-between gap-2">
          <div class="flex items-center gap-2">
            <button id="btnAbrirAgregar" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-xl font-semibold text-xs transition-all flex items-center gap-2 shadow-lg shadow-blue-600/20"><i class="fa-solid fa-plus"></i> Agregar</button>
            <button id="btnAbrirEditar" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-xl font-semibold text-xs transition-all flex items-center gap-2 border border-slate-700"><i class="fa-solid fa-pen-to-square"></i> Editar</button>
            <button id="btnEliminarDetalle" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-rose-400 rounded-xl font-semibold text-xs transition-all flex items-center gap-2 border border-slate-700"><i class="fa-solid fa-trash"></i> Eliminar</button>
          </div>
          <button id="btnExportarCsv" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-emerald-400 rounded-xl font-semibold text-xs transition-all flex items-center gap-2 border border-slate-700">
            <i class="fa-solid fa-file-excel"></i> Excel
          </button>
        </div>
      </div>
    </main>
  </div>

  <!-- Modal Registrar / Editar Detalle -->
  <div id="modalDetalle" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-lg w-full p-6 shadow-2xl flex flex-col text-xs space-y-4">
      <div class="flex items-center justify-between border-b border-slate-800 pb-3">
        <h3 id="modalTitulo" class="font-bold text-white text-sm flex items-center gap-2">
          <i class="fa-solid fa-plus-circle text-blue-500"></i> Registrar Detalle de Asiento
        </h3>
        <button id="btnCerrarModal" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
      </div>

      <form id="formDetalle" class="space-y-3">
        <div class="grid grid-cols-3 gap-3">
          <div>
            <label class="block text-slate-400 mb-1 font-semibold">N° Asiento :</label>
            <input type="text" id="detalleAsientoNum" required placeholder="Ej: 199" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-slate-200 font-mono font-bold">
          </div>
          <div>
            <label class="block text-slate-400 mb-1 font-semibold">Cuenta :</label>
            <input type="text" id="detalleCuenta" required placeholder="Ej: 5" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-slate-200 font-mono">
          </div>
          <div>
            <label class="block text-slate-400 mb-1 font-semibold">Tipo (D / C) :</label>
            <select id="detalleTipo" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-slate-200 font-bold">
              <option value="D">D (Débito)</option>
              <option value="C">C (Crédito)</option>
            </select>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-slate-400 mb-1 font-semibold">Monto USD :</label>
            <input type="number" step="0.01" id="detalleMontoUsd" value="0.00" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-slate-200 font-mono">
          </div>
          <div>
            <label class="block text-slate-400 mb-1 font-semibold">Monto BS :</label>
            <input type="number" step="0.01" id="detalleMontoBs" value="0.00" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-slate-200 font-mono">
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-slate-400 mb-1 font-semibold">Observación :</label>
            <input type="text" id="detalleObservacion" placeholder="Ej: COBRO FACT3184" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-slate-200 uppercase">
          </div>
          <div>
            <label class="block text-slate-400 mb-1 font-semibold">Estatus (Opcional) :</label>
            <input type="text" id="detalleEstatus" placeholder="Ej: 16301468" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-slate-200 font-mono">
          </div>
        </div>

        <div class="flex justify-end gap-2 pt-3 border-t border-slate-800">
          <button type="button" id="btnCancelarModal" class="px-4 py-2 bg-slate-800 text-slate-300 rounded-xl">Cancelar</button>
          <button type="submit" class="px-5 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-xl font-bold shadow-lg shadow-blue-600/20">Guardar Detalle</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module">
    import { renderAside } from '../../../js/components/aside.js';
    renderAside('contabilidad');

    import CONFIG from '../../../js/config/config.js';
    // Cambia el título de la pestaña usando los datos de config.js
    document.getElementById('site-title').innerText = `${CONFIG.SYSTEM_NAME.split(' ')[0]} - Detalle Asientos `;

  </script>
  <script type="module" src="../../../js/contabilidad/detalle_asientos.js"></script>
</body>
</html>
