<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="site-title">Cargando...</title>

  <script src="../../../js/config/config.js"></script>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="../../../css/style.css">
</head>
<body class="bg-slate-950 text-slate-100 flex h-screen transition-colors">
  
  <div id="app-aside"></div>

  <div class="flex-1 flex flex-col min-w-0 overflow-hidden">

    <main class="flex-1 overflow-y-auto p-4 md:p-6 flex flex-col gap-4 bg-slate-950/40">
      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-lg flex flex-col gap-4">
        <div class="flex items-center justify-between border-b border-slate-800 pb-3">
          <h2 class="text-xs font-bold uppercase tracking-wider text-slate-400 flex items-center gap-2">
            <i class="fa-solid fa-video text-rose-500"></i> Bitácora de Auditoría del Sistema
          </h2>
          <span id="contadorRegistros" class="text-xs font-mono bg-rose-500/10 text-rose-400 px-2.5 py-1 rounded-lg border border-rose-500/20">Cant : 0</span>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-4 gap-3 text-xs items-end">
          <div>
            <label class="block text-slate-400 mb-1 font-semibold">Desde :</label>
            <input type="date" id="filtroDesde" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-slate-200 font-mono">
          </div>
          <div>
            <label class="block text-slate-400 mb-1 font-semibold">Hasta :</label>
            <input type="date" id="filtroHasta" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-slate-200 font-mono">
          </div>
          <div>
            <label class="block text-slate-400 mb-1 font-semibold">Buscador :</label>
            <input type="text" id="inputBuscador" placeholder="Filtrar concepto o usuario..." class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-slate-200">
          </div>
          <div class="flex items-center gap-2">
            <button id="btnFiltrar" class="w-full py-2 bg-rose-600 hover:bg-rose-700 text-white rounded-xl font-bold transition-all shadow-lg shadow-rose-600/20">Filtrar</button>
          </div>
        </div>
      </div>

      <div class="flex-1 bg-slate-900 border border-slate-800 rounded-2xl shadow-xl overflow-hidden flex flex-col min-h-[320px]">
        <div class="flex-1 overflow-auto">
          <table class="w-full text-left text-xs whitespace-nowrap">
            <thead class="bg-slate-950 text-slate-400 uppercase font-semibold sticky top-0 border-b border-slate-800 z-10">
              <tr>
                <th class="p-3.5 border-r border-slate-800/50">ID</th>
                <th class="p-3.5 border-r border-slate-800/50">REGISTRO</th>
                <th class="p-3.5 border-r border-slate-800/50">HORA</th>
                <th class="p-3.5 border-r border-slate-800/50">CONCEPTO</th>
                <th class="p-3.5 border-r border-slate-800/50">ACCION</th>
                <th class="p-3.5 border-r border-slate-800/50">PROGRAMA</th>
                <th class="p-3.5 border-r border-slate-800/50">TABLA</th>
                <th class="p-3.5 border-r border-slate-800/50">USUARIO</th>
                <th class="p-3.5">EQUIPO</th>
              </tr>
            </thead>
            <tbody id="tablaAuditoriaBody" class="divide-y divide-slate-800/60"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>


  <script type="module">
    import { renderAside } from '../../../js/components/aside.js';
    renderAside('admin');

    import CONFIG from '../../../js/config/config.js';
    // Cambia el título de la pestaña usando los datos de config.js
    document.getElementById('site-title').innerText = `${CONFIG.SYSTEM_NAME.split(' ')[0]} - Auditoría`;

  </script>
  <script type="module" src="../../../js/administracion/auditoria.js"></script>
</body>
</html>
