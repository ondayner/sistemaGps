<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="site-title">Cargando...</title>

  <script src="../../../js/config/config.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="../../../css/style.css">
</head>
<body class="bg-slate-950 text-slate-100 flex h-screen transition-colors">
  
  <!-- Contenedor del Aside unificado -->
  <div id="app-aside"></div>

  <!-- Contenido Principal -->
  <div class="flex-1 flex flex-col min-w-0 overflow-hidden">

    <!-- Cuerpo principal de Monitor Galax -->
    <main class="flex-1 overflow-y-auto p-4 md:p-6 flex flex-col gap-4 bg-slate-950/40 min-w-0">
      
      <!-- Panel de Filtro de Búsqueda Directa -->
      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-lg flex flex-col gap-4">
        <div class="flex items-center justify-between border-b border-slate-800 pb-3">
          <h2 class="text-xs font-bold uppercase tracking-wider text-slate-400 flex items-center gap-2">
            <i class="fa-solid fa-desktop text-blue-500"></i> Monitor en Vivo - Equipos de Plataforma
          </h2>
          <span id="contadorRegistros" class="text-xs font-mono bg-blue-500/10 text-blue-400 px-2.5 py-1 rounded-lg border border-blue-500/20">Cant : 0</span>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3 text-xs">
          <div>
            <label class="block text-slate-400 mb-1 font-semibold">Buscar por (Nombre, IMEI o Placa) :</label>
            <div class="relative">
              <span class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-slate-500">
                <i class="fa-solid fa-magnifying-glass"></i>
              </span>
              <input type="text" id="inputBuscadorMonitor" placeholder="Escriba nombre, IMEI o placa..." class="w-full bg-slate-950 border border-slate-800 rounded-xl pl-9 pr-3 py-2 text-slate-200 focus:outline-none focus:border-blue-500">
            </div>
          </div>
        </div>
      </div>

      <!-- Tabla de Visualización en Vivo -->
      <div class="flex-1 bg-slate-900 border border-slate-800 rounded-2xl shadow-xl overflow-hidden flex flex-col min-h-[350px] min-w-0">
        <div class="flex-1 overflow-auto min-w-0 min-h-0">
          <table class="w-full text-left text-xs whitespace-nowrap">
            <thead class="bg-slate-950 text-slate-400 uppercase font-semibold sticky top-0 border-b border-slate-800 z-10">
              <tr>
                <th class="p-3.5 border-r border-slate-800/50">Secuencia</th>
                <th class="p-3.5 border-r border-slate-800/50">Nombre</th>
                <th class="p-3.5 border-r border-slate-800/50">IMEI</th>
                <th class="p-3.5 border-r border-slate-800/50">Teléfono (SIM)</th>
                <th class="p-3.5 border-r border-slate-800/50">Modelo</th>
                <th class="p-3.5 border-r border-slate-800/50">Placa</th>
                <th class="p-3.5 border-r border-slate-800/50">Propietario</th>
                <th class="p-3.5 border-r border-slate-800/50">Activo</th>
                <th class="p-3.5 border-r border-slate-800/50">Protocolo</th>
                <th class="p-3.5">Comentario</th>
              </tr>
            </thead>
            <tbody id="tablaMonitorBody" class="divide-y divide-slate-800/60">
              <!-- Cargado dinámicamente desde Supabase -->
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <!-- Script del Aside y del Módulo Monitor -->
  <script type="module">
    import { renderAside } from '../../../js/components/aside.js';
    renderAside('operaciones');

    import CONFIG from '../../../js/config/config.js';
    // Cambia el título de la pestaña usando los datos de config.js
    document.getElementById('site-title').innerText = `${CONFIG.SYSTEM_NAME.split(' ')[0]} - Monitor`;

  </script>
  <script type="module" src="../../../js/operaciones/monitor.js"></script>
</body>
</html>
