<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="site-title">Cargando...</title>

  <script src="../../../js/config/config.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="../../../css/style.css">
</head>
<body class="bg-slate-950 text-slate-100 flex h-screen transition-colors">
  
  <div id="app-aside"></div>

  <div class="flex-1 flex flex-col min-w-0 overflow-hidden">

    <main class="flex-1 overflow-y-auto p-4 md:p-6 flex flex-col gap-4 bg-slate-950/40">
      
      <!-- Filtros y Controles de Tasas -->
      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-lg flex flex-col gap-4">
        <div class="flex items-center justify-between border-b border-slate-800 pb-3">
          <h2 class="text-xs font-bold uppercase tracking-wider text-slate-400 flex items-center gap-2">
            <i class="fa-solid fa-arrow-trend-up text-emerald-500"></i> Historial de Tasas de Cambio (USD / EUR)
          </h2>
          <span id="contadorRegistros" class="text-xs font-mono bg-emerald-500/10 text-emerald-400 px-2.5 py-1 rounded-lg border border-emerald-500/20">Cant : 0</span>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-4 gap-3 text-xs items-end">
          <div>
            <label class="block text-slate-400 mb-1 font-semibold">Desde :</label>
            <input type="date" id="filtroDesde" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-slate-200 focus:outline-none focus:border-emerald-500 font-mono">
          </div>
          <div>
            <label class="block text-slate-400 mb-1 font-semibold">Hasta :</label>
            <input type="date" id="filtroHasta" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-slate-200 focus:outline-none focus:border-emerald-500 font-mono">
          </div>
          <div class="flex items-center gap-2">
            <button id="btnFiltrarFechas" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-xl font-semibold transition-all border border-slate-700 flex items-center gap-2"><i class="fa-solid fa-filter"></i> Filtrar</button>
            <button id="btnLimpiarFiltro" class="px-3 py-2 bg-slate-950 hover:bg-slate-800 text-slate-400 rounded-xl transition-all border border-slate-800" title="Limpiar Filtro"><i class="fa-solid fa-rotate-right"></i></button>
          </div>
        </div>
      </div>

      <!-- Tabla de Historial -->
      <div class="flex-1 bg-slate-900 border border-slate-800 rounded-2xl shadow-xl overflow-hidden flex flex-col min-h-[320px]">
        <div class="flex-1 overflow-auto">
          <table class="w-full text-left text-xs whitespace-nowrap">
            <thead class="bg-slate-950 text-slate-400 uppercase font-semibold sticky top-0 border-b border-slate-800 z-10">
              <tr>
                <th class="p-3.5 border-r border-slate-800/50">SECUENCIA</th>
                <th class="p-3.5 border-r border-slate-800/50">FECHA</th>
                <th class="p-3.5 border-r border-slate-800/50">USD ($)</th>
                <th class="p-3.5">EURO (€)</th>
              </tr>
            </thead>
            <tbody id="tablaTasasBody" class="divide-y divide-slate-800/60"></tbody>
          </table>
        </div>

        <div class="p-3 bg-slate-900 border-t border-slate-800 flex flex-wrap items-center justify-between gap-2">
          <div class="flex flex-wrap items-center gap-2">
            <button id="btnAbrirAgregar" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl font-semibold text-xs transition-all flex items-center gap-2"><i class="fa-solid fa-plus"></i> Registrar Tasa</button>
            <button id="btnAbrirEditar" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-xl font-semibold text-xs transition-all flex items-center gap-2 border border-slate-700"><i class="fa-solid fa-pen-to-square"></i> Editar</button>
            <button id="btnEliminarTasa" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-rose-400 rounded-xl font-semibold text-xs transition-all flex items-center gap-2 border border-slate-700"><i class="fa-solid fa-trash"></i> Eliminar</button>
          </div>
          <div>
            <button id="btnSincronizaTasa" class="px-4 py-2 bg-slate-950 hover:bg-slate-800 text-emerald-400 rounded-xl font-bold text-xs transition-all border border-emerald-500/30 flex items-center gap-2 shadow-lg"><i class="fa-solid fa-cloud-arrow-down"></i> Sincroniza Tasa</button>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Modal Formulario Tasa -->
  <div id="modalTasa" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-sm w-full p-6 shadow-2xl flex flex-col text-xs">
      <div class="flex items-center justify-between pb-3 border-b border-slate-800 mb-4">
        <h3 id="modalTitulo" class="font-bold text-white text-sm flex items-center gap-2"><i class="fa-solid fa-arrow-trend-up text-emerald-500"></i> Registrar Tasa Diaria</h3>
        <button id="btnCerrarModal" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
      </div>
      <form id="formTasa" class="space-y-4">
        <div>
          <label class="block text-slate-400 mb-1 font-semibold">Fecha :</label>
          <input type="date" id="tasaFecha" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-slate-200 focus:outline-none focus:border-emerald-500 font-mono">
        </div>
        <div>
          <label class="block text-slate-400 mb-1 font-semibold">Tasa USD ($) :</label>
          <input type="number" step="0.0001" id="tasaUsd" required placeholder="Ej: 827.7371" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-slate-200 focus:outline-none focus:border-emerald-500 font-mono">
        </div>
        <div>
          <label class="block text-slate-400 mb-1 font-semibold">Tasa Euro (€) :</label>
          <input type="number" step="0.0001" id="tasaEuro" required placeholder="Ej: 963.2128" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-slate-200 focus:outline-none focus:border-emerald-500 font-mono">
        </div>
        <div class="flex justify-end gap-2 pt-3 border-t border-slate-800">
          <button type="button" id="btnCancelarModal" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl font-semibold transition-all">Cancelar</button>
          <button type="submit" class="px-5 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl font-bold shadow-lg shadow-emerald-600/20 transition-all flex items-center gap-2"><i class="fa-solid fa-save"></i> Guardar</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module">
    import { renderAside } from '../../../js/components/aside.js';
    renderAside('finanzas');

    import CONFIG from '../../../js/config/config.js';
    // Cambia el título de la pestaña usando los datos de config.js
    document.getElementById('site-title').innerText = `${CONFIG.SYSTEM_NAME.split(' ')[0]} - Tasas de Cambio`;

  </script>
  <script type="module" src="../../../js/finanzas/tasas.js"></script>
</body>
</html>
