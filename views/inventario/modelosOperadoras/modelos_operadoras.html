<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="site-title">Cargando...</title>

  <script src="../../../js/config/config.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="../../../css/style.css">
</head>
<body class="bg-slate-950 text-slate-100 flex h-screen transition-colors">
  
  <div id="app-aside"></div>

  <div class="flex-1 flex flex-col min-w-0 overflow-hidden">

    <main class="flex-1 overflow-y-auto p-4 md:p-6 flex flex-col gap-4 bg-slate-950/40">
      
      <!-- Contenedor Superior / Encabezado y Filtros unificados -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        
        <!-- Tarjeta de Modelos GPS -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-lg flex flex-col gap-4">
          <div class="flex items-center justify-between border-b border-slate-800 pb-3">
            <h2 class="text-xs font-bold uppercase tracking-wider text-slate-400 flex items-center gap-2">
              <i class="fa-solid fa-satellite-dish text-amber-500"></i> Modelos de Equipos GPS
            </h2>
            <div class="flex items-center gap-2">
              <button id="btnAbrirModalModelo" class="px-3 py-1.5 bg-amber-600 hover:bg-amber-700 text-white rounded-xl font-semibold text-xs transition-all flex items-center gap-1.5">
                <i class="fa-solid fa-plus"></i> Nuevo Modelo
              </button>
              <span id="contadorModelos" class="text-xs font-mono bg-amber-500/10 text-amber-400 px-2.5 py-1 rounded-lg border border-amber-500/20">Cant : 0</span>
            </div>
          </div>
        </div>

        <!-- Tarjeta de Operadoras SIM -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-lg flex flex-col gap-4">
          <div class="flex items-center justify-between border-b border-slate-800 pb-3">
            <h2 class="text-xs font-bold uppercase tracking-wider text-slate-400 flex items-center gap-2">
              <i class="fa-solid fa-sim-card text-blue-500"></i> Operadoras de Líneas SIM
            </h2>
            <div class="flex items-center gap-2">
              <button id="btnAbrirModalOperadora" class="px-3 py-1.5 bg-blue-600 hover:bg-blue-700 text-white rounded-xl font-semibold text-xs transition-all flex items-center gap-1.5">
                <i class="fa-solid fa-plus"></i> Nueva Operadora
              </button>
              <span id="contadorOperadoras" class="text-xs font-mono bg-blue-500/10 text-blue-400 px-2.5 py-1 rounded-lg border border-blue-500/20">Cant : 0</span>
            </div>
          </div>
        </div>

      </div>

      <!-- Tablas de Contenido en Paralelo -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4 flex-1 min-h-[320px]">
        
        <!-- Tabla Modelos -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl shadow-xl overflow-hidden flex flex-col">
          <div class="flex-1 overflow-auto">
            <table class="w-full text-left text-xs whitespace-nowrap">
              <thead class="bg-slate-950 text-slate-400 uppercase font-semibold sticky top-0 border-b border-slate-800 z-10">
                <tr>
                  <th class="p-3.5 border-r border-slate-800/50">SECUENCIA</th>
                  <th class="p-3.5 border-r border-slate-800/50">NOMBRE DEL MODELO</th>
                  <th class="p-3.5 text-center">ACCIONES</th>
                </tr>
              </thead>
              <tbody id="tablaModelosBody" class="divide-y divide-slate-800/60"></tbody>
            </table>
          </div>
        </div>

        <!-- Tabla Operadoras -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl shadow-xl overflow-hidden flex flex-col">
          <div class="flex-1 overflow-auto">
            <table class="w-full text-left text-xs whitespace-nowrap">
              <thead class="bg-slate-950 text-slate-400 uppercase font-semibold sticky top-0 border-b border-slate-800 z-10">
                <tr>
                  <th class="p-3.5 border-r border-slate-800/50">SECUENCIA</th>
                  <th class="p-3.5 border-r border-slate-800/50">NOMBRE DE OPERADORA</th>
                  <th class="p-3.5 text-center">ACCIONES</th>
                </tr>
              </thead>
              <tbody id="tablaOperadorasBody" class="divide-y divide-slate-800/60"></tbody>
            </table>
          </div>
        </div>

      </div>
    </main>
  </div>

  <!-- Modal Único para Registrar / Editar (Modelo u Operadora) -->
  <div id="modalCatalogo" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-md w-full p-6 shadow-2xl flex flex-col text-xs space-y-4">
      <div class="flex items-center justify-between border-b border-slate-800 pb-3">
        <h3 id="modalCatalogoTitulo" class="font-bold text-white text-sm flex items-center gap-2">
          <i class="fa-solid fa-pen-to-square text-amber-500"></i> Registrar Elemento
        </h3>
        <button id="btnCerrarModalCatalogo" class="text-slate-400 hover:text-white p-1"><i class="fa-solid fa-xmark text-lg"></i></button>
      </div>

      <form id="formCatalogo" class="space-y-3">
        <input type="hidden" id="catalogoTipo">
        <input type="hidden" id="catalogoId">
        <div>
          <label class="block text-slate-400 mb-1 font-semibold">Nombre :</label>
          <input type="text" id="catalogoNombre" required placeholder="EJ: FMB920 O MOVILNET" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-slate-200 uppercase font-bold focus:border-amber-500">
        </div>

        <div class="flex justify-end gap-2 pt-3 border-t border-slate-800">
          <button type="button" id="btnCancelarModalCatalogo" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl font-semibold transition-all">Cancelar</button>
          <button type="submit" class="px-5 py-2 bg-amber-600 hover:bg-amber-700 text-white rounded-xl font-bold shadow-lg shadow-amber-600/20 transition-all">Guardar</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module">
    import { renderAside } from '../../../js/components/aside.js';
    renderAside('inventario');

    import CONFIG from '../../../js/config/config.js';
    document.getElementById('site-title').innerText = `${CONFIG.SYSTEM_NAME.split(' ')[0]} - Modelos y Operadoras`;
  </script>
  <script type="module" src="../../../js/inventario/modelos_operadoras.js"></script>
</body>
</html>
