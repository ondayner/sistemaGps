<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="site-title">Cargando...</title>

  <script src="../../../js/config/config.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="../../../css/style.css">
</head>
<body class="bg-slate-950 text-slate-100 flex h-screen transition-colors">
  
  <div id="app-aside"></div>

  <div class="flex-1 flex flex-col min-w-0 overflow-hidden">

    <main class="flex-1 overflow-y-auto p-4 md:p-6 flex flex-col gap-4 bg-slate-950/40">
      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-lg flex flex-col gap-4">
        <div class="flex items-center justify-between border-b border-slate-800 pb-3">
          <h2 class="text-xs font-bold uppercase tracking-wider text-slate-400 flex items-center gap-2">
            <i class="fa-solid fa-boxes-stacked text-amber-500"></i> Inventario General (Equipos y Líneas)
          </h2>
          <span id="contadorRegistros" class="text-xs font-mono bg-amber-500/10 text-amber-400 px-2.5 py-1 rounded-lg border border-amber-500/20">Cant : 0</span>
        </div>
        
        <!-- Filtros Avanzados -->
        <div class="grid grid-cols-1 sm:grid-cols-4 gap-3 text-xs">
          <div>
            <label class="block text-slate-400 mb-1 font-semibold">Buscador :</label>
            <input type="text" id="inputBuscador" placeholder="Buscar identificador, modelo, operadora..." class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-slate-200 focus:outline-none focus:border-amber-500">
          </div>
          <div>
            <label class="block text-slate-400 mb-1 font-semibold">Tipo de Elemento :</label>
            <select id="selectFiltroTipo" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-slate-200">
              <option value="todos">TODOS (EQUIPOS Y LÍNEAS)</option>
              <option value="equipo">SOLO EQUIPOS GPS</option>
              <option value="linea">SOLO LÍNEAS</option>
            </select>
          </div>
          <div>
            <label class="block text-slate-400 mb-1 font-semibold">Estado :</label>
            <select id="selectFiltroEstado" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-slate-200">
              <option value="todos">TODOS LOS ESTADOS</option>
              <option value="disponible">DISPONIBLE (EN ALMACÉN)</option>
              <option value="asignado">ASIGNADO (EN USO / PLATAFORMA)</option>
            </select>
          </div>
          <div>
            <label class="block text-slate-400 mb-1 font-semibold">Origen :</label>
            <select id="selectFiltroOrigen" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-slate-200">
              <option value="todos">TODOS LOS ORIGENES</option>
              <option value="lote">LOTE DE ALMACÉN</option>
              <option value="unitario">INGRESO UNITARIO / DIRECTO</option>
            </select>
          </div>
        </div>
      </div>

      <div class="flex-1 bg-slate-900 border border-slate-800 rounded-2xl shadow-xl overflow-hidden flex flex-col min-h-[320px]">
        <div class="flex-1 overflow-auto">
          <table class="w-full text-left text-xs whitespace-nowrap">
            <thead class="bg-slate-950 text-slate-400 uppercase font-semibold sticky top-0 border-b border-slate-800 z-10">
              <tr>
                <th class="p-3.5 border-r border-slate-800/50">ESTATUS / ALERTA</th>
                <th class="p-3.5 border-r border-slate-800/50">TIPO</th>
                <th class="p-3.5 border-r border-slate-800/50">IDENTIFICADOR (IMEI / TELÉFONO)</th>
                <th class="p-3.5 border-r border-slate-800/50">MODELO / OPERADORA</th>
                <th class="p-3.5 border-r border-slate-800/50">PROVEEDOR / ICCID</th>
                <th class="p-3.5">NOTA / ORIGEN</th>
              </tr>
            </thead>
            <tbody id="tablaInventarioBody" class="divide-y divide-slate-800/60"></tbody>
          </table>
        </div>

        <div class="p-3 bg-slate-900 border-t border-slate-800 flex flex-wrap items-center justify-between gap-2">
          <div class="flex items-center gap-2">
            <button id="btnAbrirAgregar" class="px-4 py-2 bg-amber-600 hover:bg-amber-700 text-white rounded-xl font-semibold text-xs transition-all flex items-center gap-2"><i class="fa-solid fa-plus"></i> Ingresar Lote / Elemento</button>
            <button id="btnEliminar" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-rose-400 rounded-xl font-semibold text-xs transition-all flex items-center gap-2 border border-slate-700"><i class="fa-solid fa-trash"></i> Eliminar</button>
            <button id="btnExportarCsv" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-xl font-semibold text-xs transition-all flex items-center gap-2 border border-slate-700">
                <i class="fa-solid fa-file-excel text-emerald-400"></i> Exportar
            </button>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Modal Ingreso (Lote Equipos, Lote Líneas o Unitario) -->
  <div id="modalInventario" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-lg w-full p-6 shadow-2xl flex flex-col text-xs max-h-[90vh] overflow-hidden">
      <h3 class="font-bold text-white text-sm mb-4">Ingreso de Inventario General</h3>
      
      <div class="mb-3">
        <label class="block text-slate-400 mb-1 font-semibold">Seleccionar Categoría de Ingreso :</label>
        <select id="selectTipoIngreso" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-slate-200 text-xs">
          <option value="lote_equipos">Lote Masivo de Equipos GPS</option>
          <option value="lote_lineas">Lote Masivo de Líneas Telefónicas</option>
          <option value="unitario_equipo">Equipo Unitario (Con IMEI)</option>
          <option value="unitario_linea">Línea Unitaria (Con Número)</option>
        </select>
      </div>

      <form id="formInventario" class="space-y-3 flex-1 overflow-y-auto pr-1">
        <div>
          <label class="block text-slate-400 mb-1 font-semibold" id="labelIdentificador">Nombre de Lote / Identificador :</label>
          <input type="text" id="invIdentificador" required placeholder="Ej: LOTE-MOVILNET-2026" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-slate-200 font-mono uppercase">
        </div>

        <div id="campoCantidadLote" class="grid grid-cols-1 sm:grid-cols-2 gap-2">
          <div>
            <label class="block text-slate-400 mb-1 font-semibold">Cantidad en el Lote :</label>
            <input type="number" id="invCantidad" min="1" max="20" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-slate-200 font-mono">
          </div>
          <div class="relative">
            <label class="block text-slate-400 mb-1 font-semibold" id="labelModeloOperadoraMaster">Modelo Maestro :</label>
            <input type="text" id="invMasterDetalle" autocomplete="off" placeholder="Seleccione o escriba..." class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-slate-200 uppercase font-mono focus:outline-none focus:border-amber-500">
            <div id="sugerenciasMasterInv" class="absolute left-0 right-0 top-full mt-1 bg-slate-900 border border-slate-700 rounded-xl shadow-2xl max-h-48 overflow-y-auto z-50 hidden divide-y divide-slate-800 text-xs"></div>
          </div>
        </div>

        <div id="campoExtra" class="relative">
          <label class="block text-slate-400 mb-1 font-semibold">Proveedor General :</label>
          <input type="text" id="invExtra" autocomplete="off" placeholder="Escriba o seleccione proveedor..." class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-slate-200 uppercase focus:outline-none focus:border-amber-500 font-mono">
          <div id="sugerenciasProveedoresInv" class="absolute left-0 right-0 top-full mt-1 bg-slate-900 border border-slate-700 rounded-xl shadow-2xl max-h-48 overflow-y-auto z-50 hidden divide-y divide-slate-800 text-xs"></div>
        </div>

        <!-- Contenedor dinámico donde se generan los inputs detallados de cada equipo o línea -->
        <div class="pt-2">
          <label class="block text-slate-400 mb-1.5 font-semibold">Detalle de Elementos :</label>
          <div id="contenedorInputsDinamicos" class="space-y-2"></div>
        </div>

        <div class="flex justify-end gap-2 pt-3 border-t border-slate-800 sticky bottom-0 bg-slate-900 py-2">
          <button type="button" id="btnCerrarModal" class="px-4 py-2 bg-slate-800 text-slate-300 rounded-xl">Cancelar</button>
          <button type="submit" class="px-4 py-2 bg-amber-600 text-white rounded-xl font-bold">Guardar Entrada</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal Alerta -->
  <div id="modalAlerta" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-sm w-full p-6 shadow-2xl text-center space-y-4">
      <div class="w-12 h-12 bg-amber-500/10 border border-amber-500/20 text-amber-400 rounded-2xl flex items-center justify-center mx-auto text-xl">
        <i class="fa-solid fa-triangle-exclamation"></i>
      </div>
      <div>
        <h3 class="font-bold text-white text-sm">GalaxGPS - Aviso</h3>
        <p id="textoAlertaModal" class="text-xs text-slate-400 mt-1">Aviso</p>
      </div>
      <button id="btnCerrarAlerta" class="w-full py-2.5 bg-amber-600 hover:bg-amber-700 text-white rounded-xl text-xs font-bold transition-all shadow-lg shadow-amber-600/20">Aceptar</button>
    </div>
  </div>

  <!-- Modal de Confirmación para Eliminar -->
  <div id="modalEliminar" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-sm w-full p-6 shadow-2xl text-center space-y-4">
      <div class="w-12 h-12 bg-rose-500/10 border border-rose-500/20 text-rose-400 rounded-2xl flex items-center justify-center mx-auto text-xl">
        <i class="fa-solid fa-triangle-exclamation"></i>
      </div>
      <div>
        <h3 class="font-bold text-white text-sm">GalaxGPS - Confirmar Eliminación</h3>
        <p id="textoEliminarModal" class="text-xs text-slate-400 mt-1">¿Seguro que deseas eliminar este registro?</p>
      </div>
      <div class="flex items-center gap-2 pt-2">
        <button id="btnCancelarEliminar" class="w-1/2 py-2.5 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl text-xs font-bold transition-all">Cancelar</button>
        <button id="btnConfirmarEliminar" class="w-1/2 py-2.5 bg-rose-600 hover:bg-rose-700 text-white rounded-xl text-xs font-bold transition-all shadow-lg shadow-rose-600/20">Sí, eliminar</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { renderAside } from '../../../js/components/aside.js';
    renderAside('inventario');

    import CONFIG from '../../../js/config/config.js';
    document.getElementById('site-title').innerText = `${CONFIG.SYSTEM_NAME.split(' ')[0]} - Inventario General`;
  </script>
  <script type="module" src="../../../js/inventario/inventario_general.js"></script>
</body>
</html>
