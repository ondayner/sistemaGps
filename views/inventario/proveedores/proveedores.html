<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="site-title">Cargando...</title>

  <script src="../../../js/config/config.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="../../../css/style.css">
</head>
<body class="bg-slate-950 text-slate-100 flex h-screen transition-colors">
  
  <div id="app-aside"></div>

  <div class="flex-1 flex flex-col min-w-0 overflow-hidden">

    <main class="flex-1 overflow-y-auto p-4 md:p-6 flex flex-col gap-4 bg-slate-950/40">
      
      <!-- Filtros y Buscador -->
      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-lg flex flex-col gap-4">
        <div class="flex items-center justify-between border-b border-slate-800 pb-3">
          <h2 class="text-xs font-bold uppercase tracking-wider text-slate-400 flex items-center gap-2">
            <i class="fa-solid fa-truck-field text-amber-500"></i> Gestión de Proveedores
          </h2>
          <span id="contadorRegistros" class="text-xs font-mono bg-amber-500/10 text-amber-400 px-2.5 py-1 rounded-lg border border-amber-500/20">Cant : 0</span>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3 text-xs">
          <div>
            <label class="block text-slate-400 mb-1 font-semibold">Buscar en :</label>
            <select id="filtroCampo" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-slate-200 focus:outline-none focus:border-amber-500">
              <option value="nombre">Nombre de Proveedor</option>
              <option value="contacto">Persona de Contacto</option>
              <option value="telefono">Teléfono</option>
              <option value="correo">Correo Electrónico</option>
            </select>
          </div>
          <div>
            <label class="block text-slate-400 mb-1 font-semibold">Buscador :</label>
            <div class="relative">
              <span class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-slate-500">
                <i class="fa-solid fa-magnifying-glass"></i>
              </span>
              <input type="text" id="inputBuscador" placeholder="Escriba para filtrar..." class="w-full bg-slate-950 border border-slate-800 rounded-xl pl-9 pr-3 py-2 text-slate-200 focus:outline-none focus:border-amber-500">
            </div>
          </div>
        </div>
      </div>

      <!-- Tabla de Datos -->
      <div class="flex-1 bg-slate-900 border border-slate-800 rounded-2xl shadow-xl overflow-hidden flex flex-col min-h-[300px]">
        <div class="flex-1 overflow-auto">
          <table class="w-full text-left text-xs whitespace-nowrap">
            <thead class="bg-slate-950 text-slate-400 uppercase font-semibold sticky top-0 border-b border-slate-800 z-10">
              <tr>
                <th class="p-3.5">ID</th>
                <th class="p-3.5">Proveedor</th>
                <th class="p-3.5">Contacto</th>
                <th class="p-3.5">Teléfono</th>
                <th class="p-3.5">Correo</th>
                <th class="p-3.5">Dirección</th>
              </tr>
            </thead>
            <tbody id="tablaProveedoresBody" class="divide-y divide-slate-800/60">
              <!-- Dinámico -->
            </tbody>
          </table>
        </div>

        <div class="p-3 bg-slate-900 border-t border-slate-800 flex flex-wrap items-center justify-between gap-2">
          <div class="flex flex-wrap items-center gap-2">
            <button id="btnAbrirAgregar" class="px-4 py-2 bg-amber-600 hover:bg-amber-700 text-white rounded-xl font-semibold shadow-lg shadow-amber-600/20 text-xs transition-all flex items-center gap-2">
              <i class="fa-solid fa-plus"></i> Agregar Proveedor
            </button>
            <button id="btnAbrirEditar" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-xl font-semibold text-xs transition-all flex items-center gap-2 border border-slate-700">
              <i class="fa-solid fa-pen-to-square"></i> Editar
            </button>
            <button id="btnEliminarProveedor" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-rose-400 rounded-xl font-semibold text-xs transition-all flex items-center gap-2 border border-slate-700">
              <i class="fa-solid fa-trash"></i> Eliminar
            </button>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Modal Agregar / Editar Proveedor -->
  <div id="modalProveedor" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-lg w-full p-6 shadow-2xl flex flex-col text-xs">
      
      <div class="flex items-center justify-between pb-4 border-b border-slate-800">
        <h3 id="modalTitulo" class="font-bold text-white text-sm flex items-center gap-2">
          <i class="fa-solid fa-truck-field text-amber-500"></i> Registrar Proveedor
        </h3>
        <button id="btnCerrarModal" class="text-slate-400 hover:text-white p-1"><i class="fa-solid fa-xmark text-lg"></i></button>
      </div>

      <form id="formProveedor" class="py-4 space-y-4">
        <div>
          <label class="block text-slate-400 mb-1 font-semibold">Nombre de la Empresa / Proveedor :</label>
          <input type="text" id="provNombre" required placeholder="Ej: TECNOLOGIA GPS CA" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-slate-200 focus:outline-none focus:border-amber-500 font-bold uppercase">
          <span id="errorNombre" class="text-rose-400 text-[10px] mt-1 hidden block font-semibold"></span>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-slate-400 mb-1 font-semibold">Persona de Contacto :</label>
            <input type="text" id="provContacto" placeholder="Ej: Carlos Mendoza" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-slate-200 focus:outline-none focus:border-amber-500 uppercase">
          </div>
          <div>
            <label class="block text-slate-400 mb-1 font-semibold">Teléfono :</label>
            <input type="text" id="provTelefono" placeholder="Ej: 0414-1234567" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-slate-200 focus:outline-none focus:border-amber-500 font-mono">
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-slate-400 mb-1 font-semibold">Correo Electrónico :</label>
            <input type="email" id="provCorreo" placeholder="Ej: ventas@proveedor.com" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-slate-200 focus:outline-none focus:border-amber-500">
          </div>
          <div>
            <label class="block text-slate-400 mb-1 font-semibold">Estatus :</label>
            <select id="provEstatus" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-slate-200 focus:outline-none focus:border-amber-500 font-bold">
              <option value="ACTIVO">ACTIVO</option>
              <option value="INACTIVO">INACTIVO</option>
            </select>
          </div>
        </div>

        <div>
          <label class="block text-slate-400 mb-1 font-semibold">Dirección :</label>
          <textarea id="provDireccion" rows="2" placeholder="Ubicación física..." class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-slate-200 focus:outline-none focus:border-amber-500 resize-none uppercase"></textarea>
        </div>

        <div class="pt-3 flex items-center justify-end gap-2 border-t border-slate-800">
          <button type="button" id="btnCancelarModal" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl transition-all">Cancelar</button>
          <button type="submit" class="px-5 py-2 bg-amber-600 hover:bg-amber-700 text-white rounded-xl font-bold shadow-lg shadow-amber-600/20 transition-all flex items-center gap-2">
            <i class="fa-solid fa-save"></i> Guardar Proveedor
          </button>
        </div>
      </form>
    </div>
  </div>

  <script type="module">
    import { renderAside } from '../../../js/components/aside.js';
    renderAside('inventario');

    import CONFIG from '../../../js/config/config.js';
    // Cambia el título de la pestaña usando los datos de config.js
    document.getElementById('site-title').innerText = `${CONFIG.SYSTEM_NAME.split(' ')[0]} - Proveedores`;

  </script>
  <script type="module" src="../../../js/inventario/proveedores.js"></script>
</body>
</html>
