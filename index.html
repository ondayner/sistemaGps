<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="site-title"></title>
  <script src="https://cdn.tailwindcss.com"></script>
  
  <script src="js/config/config.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="./css/style.css">
</head>
<body class="bg-gray-100 dark:bg-slate-950 text-gray-900 dark:text-slate-100 min-h-screen flex items-center justify-center p-4 sm:p-6 transition-colors">
  
  <!-- Tarjeta de Login Adaptativa -->
  <div class="w-full max-w-sm sm:max-w-md bg-white dark:bg-slate-900 border border-gray-200 dark:border-slate-800 rounded-2xl shadow-xl p-6 sm:p-8 relative overflow-hidden transition-all">
    
    <!-- Alerta / Modal integrado estéticamente (Oculto por defecto) -->
    <div id="authAlert" class="hidden mb-5 p-3.5 rounded-xl text-xs sm:text-sm flex items-center gap-3 border bg-rose-50 dark:bg-rose-950/40 border-rose-200 dark:border-rose-900/50 text-rose-700 dark:text-rose-400">
      <i class="fa-solid fa-triangle-exclamation text-base shrink-0"></i>
      <span id="alertMessage" class="font-medium">Correo o contraseña incorrectos.</span>
    </div>

    <!-- Encabezado / Logo -->
    <div class="text-center mb-6 sm:mb-8">
      <div class="w-14 h-14 sm:w-16 sm:h-16 bg-blue-600 rounded-2xl flex items-center justify-center mx-auto mb-3 shadow-lg shadow-blue-600/25">
        <i class="fa-solid fa-satellite-dish text-2xl sm:text-3xl text-white"></i>
      </div>
      <h1 class="text-lg sm:text-xl font-bold tracking-tight text-gray-900 dark:text-white" id="app-name-form"></h1>
      <p class="text-[11px] sm:text-xs text-gray-500 dark:text-slate-400 mt-1" id="app-description-form"></p>
    </div>

    <!-- Formulario -->
    <form class="space-y-4">
      <div>
        <label class="block text-[11px] sm:text-xs font-semibold uppercase tracking-wider mb-1.5 text-gray-600 dark:text-slate-400">Correo Electrónico</label>
        <input type="text" id="email" placeholder="correo@dominio.com" required 
          class="w-full px-4 py-2.5 sm:py-3 bg-gray-50 dark:bg-slate-950 border border-gray-300 dark:border-slate-800 rounded-xl focus:outline-none focus:border-blue-500 dark:text-white text-xs sm:text-sm transition-colors">
      </div>
      <div>
        <label class="block text-[11px] sm:text-xs font-semibold uppercase tracking-wider mb-1.5 text-gray-600 dark:text-slate-400">Contraseña</label>
        <input type="password" id="password" placeholder="••••••••" required 
          class="w-full px-4 py-2.5 sm:py-3 bg-gray-50 dark:bg-slate-950 border border-gray-300 dark:border-slate-800 rounded-xl focus:outline-none focus:border-blue-500 dark:text-white text-xs sm:text-sm transition-colors">
      </div>
      <button type="submit" class="w-full py-3 bg-blue-600 hover:bg-blue-700 active:scale-[0.98] text-white rounded-xl font-bold transition-all shadow-lg shadow-blue-600/20 text-xs sm:text-sm mt-2">
        Entrar al Sistema
      </button>
    </form>
  </div>

  <!-- Script del Login -->
  <script type="module" src="./js/login.js"></script>
    <script type="module">
    import CONFIG from './js/config/config.js';
    // Cambia el título de la pestaña usando los datos de config.js
    document.getElementById('site-title').innerText = `${CONFIG.SYSTEM_NAME.split(' ')[0]} - Login`;
    </script>
</body>
</html>
